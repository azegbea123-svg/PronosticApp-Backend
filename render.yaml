services:
  - type: web
    name: pronosticapp-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      # Clés à renseigner dans le tableau de bord Render (sync: false = jamais versionnées).
      - key: RAPIDAPI_KEY
        sync: false
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
