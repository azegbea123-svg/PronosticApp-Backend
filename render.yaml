databases:
  - name: pronosticapp-db
    plan: free

services:
  - type: web
    name: pronosticapp-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pronosticapp-db
          property: connectionString
